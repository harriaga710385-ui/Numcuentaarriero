<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Datos de pago - El Arriero Agroveterinaria</title>
<style>
  :root {
    box-sizing: border-box;
    --bg: #f7f3ea; --card: #ffffff; --brand: #8b6932; --text: #222; --muted: #555;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a17; --card: #2a2722; --brand: #c9a461; --text: #f3efe6; --muted: #bdb5a3;
    }
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.3;
    user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column;
  }
  header { background: var(--brand); color: #fff; text-align: center; padding: 8px 12px 10px; }
  header img { width: 56px; height: 56px; display: block; margin: 0 auto 4px; }
  header h1 { margin: 0; font-size: 16px; letter-spacing: .5px; }
  header p { margin: 2px 0 0; font-size: 12px; }
  main { max-width: 560px; width: 100%; margin: 0 auto; padding: 8px 10px; box-sizing: border-box; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .card { background: var(--card); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .label { font-size: 11px; color: var(--muted); margin: 0; }
  .value { font-size: 15px; font-weight: 700; margin: 0; }
  .account { font-size: 17px; font-weight: 700; word-break: break-all; margin: 2px 0 0; }
  button {
    width: 100%; margin-top: 6px; padding: 9px; font-size: 14px; font-weight: 700;
    border: none; border-radius: 9px; background: var(--brand); color: #fff; cursor: pointer;
  }
  button:active { opacity: .85; }
  .secondary { background: #25a244; }
  .msg { text-align: center; color: #2e7d32; font-size: 12px; min-height: 16px; margin: 4px 0 0; }
  .note { text-align: center; color: var(--muted); font-size: 11px; margin: 4px 0 0; }
  #overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 10;
    flex-direction: column; align-items: center; justify-content: center; padding: 12px; box-sizing: border-box;
  }
  #overlay.show { display: flex; }
  #posterImg { max-width: 100%; max-height: 78vh; border-radius: 12px; user-select: auto; -webkit-user-select: auto; -webkit-touch-callout: default; }
  #btnCerrar { width: auto; margin-top: 10px; padding: 9px 28px; background: #555; }
  .btn-link { display: block; box-sizing: border-box; width: 100%; max-width: 320px; margin-top: 8px; padding: 10px; text-align: center; text-decoration: none; font-size: 15px; font-weight: 700; border-radius: 9px; background: #25a244; color: #fff; }
  #overlay > button, #overlay > .msg { max-width: 320px; box-sizing: border-box; }
</style>
</head>

  <h1>DATOS DE PAGO</h1>
  <p>El Arriero Agroveterinaria</p>
</header>
<main>
  <div class="card">
    <p class="label">Banco</p>
    <p class="value">BBVA Bancomer</p>
  </div>
  <div class="card">
    <p class="label">Titular</p>
    <p class="value">Ronel Aguilar Meza</p>
  </div>
  <div class="card">
    <p class="label">No. de cuenta / tarjeta</p>
    <p class="account" id="cuenta">4152314272205801</p>
    <button id="btnCopiar">Copiar número</button>
    <p class="msg" id="msgCopiar"></p>
  </div>
  <div class="card">
    <p class="label">Enviar comprobante de pago al</p>
    <p class="value">962 210 1576</p>
  </div>
  <div class="card">
    <p class="label">Guardar en mi teléfono</p>
    <button id="btnGuardar" class="secondary">Guardar datos como imagen</button>
    <p class="msg" id="msgGuardar"></p>
  </div>
  <p class="note">Gracias por su pago</p>
</main>

<div id="overlay">
  <img id="posterImg" alt="Datos de pago">
  <p class="msg" style="color:#fff">Descárgala o compártela para guardarla en tu galería.</p>
  <a id="btnDescargar" class="btn-link" download="datos_pago_el_arriero.png">Descargar imagen</a>
  <button id="btnCompartir" class="secondary">Compartir / Guardar en Fotos</button>
  <button id="btnCerrar">Cerrar</button>
</div>
<script>
  const CUENTA = '4152314272205801';
  const msgCopiar = document.getElementById('msgCopiar');
  const msgGuardar = document.getElementById('msgGuardar');
  document.getElementById('btnCerrar').addEventListener('click', () => {
    document.getElementById('overlay').classList.remove('show');
  });

  document.getElementById('btnCopiar').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(CUENTA);
      msgCopiar.textContent = '¡Número copiado!';
    } catch (e) {
      const range = document.createRange();
      range.selectNodeContents(document.getElementById('cuenta'));
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
      msgCopiar.textContent = 'Mantén presionado el número para copiarlo';
    }
  });

  function drawPoster(logoImg) {
    const W = 1080, H = 1500;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#8b6932'; ctx.fillRect(0, 0, W, 260);
    if (logoImg) ctx.drawImage(logoImg, W/2 - 90, 20, 180, 180);
    const centerText = (t, y, font, color) => {
      ctx.font = font; ctx.fillStyle = color; ctx.textAlign = 'center';
      ctx.fillText(t, W/2, y);
    };
    centerText('DATOS DE PAGO', 340, 'bold 84px Arial', '#222');
    centerText('El Arriero Agroveterinaria', 420, '48px Arial', '#555');
    const rows = [
      ['Banco', 'BBVA Bancomer'],
      ['Titular', 'Ronel Aguilar Meza'],
      ['No. de cuenta / tarjeta', '4152 3142 7220 5801'],
      ['Comprobante al', '962 210 1576']
    ];
    let y = 560;
    rows.forEach(([label, value]) => {
      centerText(label, y, '40px Arial', '#555');
      centerText(value, y + 75, 'bold 60px Arial', '#222');
      y += 200;
    });
    return c;
  }

  let posterBlob = null;
  document.getElementById('btnGuardar').addEventListener('click', () => {
    const canvas = drawPoster(document.querySelector('header img'));
    canvas.toBlob((blob) => {
      posterBlob = blob;
      const url = URL.createObjectURL(blob);
      document.getElementById('posterImg').src = url;
      document.getElementById('btnDescargar').href = url;
      document.getElementById('overlay').classList.add('show');
    }, 'image/png');
  });
  document.getElementById('btnCompartir').addEventListener('click', async () => {
    if (!posterBlob) return;
    const file = new File([posterBlob], 'datos_pago_el_arriero.png', { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Datos de pago' });
      } else {
        alert('Tu navegador no permite compartir. Usa Descargar imagen.');
      }
    } catch (err) { /* el usuario canceló */ }
  });
</script>
</body>
</html>
