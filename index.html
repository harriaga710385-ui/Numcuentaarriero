<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Datos de pago - El Arriero Agroveterinaria</title>
<style>
  :root {
    box-sizing: border-box;
    --bg: #f7f3ea;
    --card: #ffffff;
    --brand: #8b6932;
    --text: #222;
    --muted: #555;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a17; --card: #2a2722; --brand: #c9a461; --text: #f3efe6; --muted: #bdb5a3;
    }
  }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 22px;
    line-height: 1.4;
    user-select: none;
    -webkit-user-select: none;
  }
  header {
    background: var(--brand);
    color: #fff;
    text-align: center;
    padding: 28px 16px;
  }
  header h1 { margin: 0; font-size: 36px; letter-spacing: 1px; }
  header p { margin: 6px 0 0; font-size: 24px; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 18px 40px; }
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 22px 20px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .label { font-size: 20px; color: var(--muted); margin: 0 0 4px; }
  .value { font-size: 30px; font-weight: 700; margin: 0; }
  .account { font-size: 34px; font-weight: 700; word-break: break-all; margin: 6px 0 0; }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 18px;
    font-size: 24px;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    background: var(--brand);
    color: #fff;
    cursor: pointer;
  }
  button:active { opacity: .85; }
  .copied { text-align: center; color: #2e7d32; font-size: 22px; min-height: 28px; margin: 8px 0 0; }
  .phone-btn {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #25a244;
  }
  .note { text-align: center; color: var(--muted); font-size: 20px; margin-top: 20px; }
</style>
</head>
<body>
<header>
  <h1>DATOS DE PAGO</h1>
  <p>El Arriero Agroveterinaria</p>
</header>
<main>
  <div class="card">
    <p class="label">Banco</p>
    <p class="value">BBVA Bancomer</p>
  </div>
  <div class="card">
    <p class="label">Titular</p>
    <p class="value">Ronel Aguilar Meza</p>
  </div>
  <div class="card">
    <p class="label">No. de cuenta / tarjeta</p>
    <p class="account" id="cuenta">4152314272205801</p>
    <button id="btnCopiar">Copiar número</button>
    <p class="copied" id="msg"></p>
  </div>
  <div class="card">
    <p class="label">Enviar comprobante de pago al</p>
    <p class="value">962 210 1576</p>
  </div>
  <p class="note">Gracias por su pago</p>
</main>
<script>
  const btn = document.getElementById('btnCopiar');
  const msg = document.getElementById('msg');
  const cuenta = document.getElementById('cuenta').textContent.trim();
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(cuenta);
      msg.textContent = '¡Número copiado!';
    } catch (e) {
      const range = document.createRange();
      range.selectNodeContents(document.getElementById('cuenta'));
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      msg.textContent = 'Mantén presionado el número para copiarlo';
    }
  });
</script>
</body>
</html>
